<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · La Profe Rico</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#92374D">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f4f2;font-family:Inter,system-ui,"PingFang TC","Noto Sans TC",sans-serif;color:#2a2230;padding:20px}
.box{background:#fff;max-width:520px;border-radius:22px;padding:44px 32px;text-align:center;box-shadow:0 10px 30px rgba(74,40,60,.10);border-top:6px solid #ffbc42}
h1{font-family:Fraunces,Georgia,serif;color:#92374D;margin:0 0 12px}
p{color:#5d5561;line-height:1.6}
a{display:inline-block;margin-top:16px;background:#92374D;color:#fff;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h1 id="t">Thank you!</h1>
  <p id="m">Your message has been sent. I'll reply by email within a day or two.</p>
  <a href="/" id="b">Back to the site</a>
</div>
<script>
const L={es:["¡Gracias!","Tu mensaje se ha enviado. Te responderé por email en uno o dos días.","Volver a la web"],
zh:["謝謝您！","您的訊息已送出，我會在一兩天內以電子郵件回覆。","返回網站"]};
let l=null;try{l=localStorage.getItem("lang")}catch(e){}
if(L[l]){t.textContent=L[l][0];m.textContent=L[l][1];b.textContent=L[l][2];}
</script>
</body>
</html>
